[project]
name = "nanofaas"
version = "0.1.0"
description = "A scale-to-zero function platform that measures its own cold-start tax and picks the idle timeout from real traffic"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "numpy>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["docker: needs a running Docker daemon"]
